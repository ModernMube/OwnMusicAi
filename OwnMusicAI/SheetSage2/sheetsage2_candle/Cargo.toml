[package]
name = "sheetsage2_engine"
version = "0.1.0"
edition = "2024"
description = "SheetSage2 inference primitives (log-mel + MERT-v2 encoder, BART decoder step) on Candle, exported over a C ABI"
license = "CC-BY-NC-4.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
realfft = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]

[profile.release]
debug = false
lto = "thin"
